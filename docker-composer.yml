version: '3.8'

services:
  opwsl-s:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opwsl-s
    ports:
      - "3001:3001"  # <--- VPS port 3006 maps to container port 3005
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped