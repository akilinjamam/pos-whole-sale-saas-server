name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "."
          target: "/www/pos-whole-sale-saas-server"

      - name: Build and Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /www/pos-whole-sale-saas-server

            echo "Installing dependencies..."
            npm install

            echo "Building application..."
            npm run build

            echo "Removing development dependencies..."
            npm prune --omit=dev

            echo "Restarting application..."

            if pm2 describe pos-whole-sale-server > /dev/null 2>&1; then
              pm2 restart pos-whole-sale-server
            else
              pm2 start npm --name "pos-whole-sale-server" -- start
            fi

            pm2 save

            echo "Deployment completed successfully!"