version: '3.8'

services:
  wholesale-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wholesale-server-container
    ports:
      - "3006:3006"  # <--- VPS port 3006 maps to container port 3005
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped